#_preseed_V1
# Magic header so Debian knows this is a valid preseed file.
# https://www.debian.org/releases/trixie/example-preseed.txt

### 1. Language & Keyboard
# Sets the OS language, UTF-8 formatting, and US keyboard layout.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### 2. Networking
# Picks the first active virtual network card and gets an IP via DHCP.
d-i netcfg/choose_interface select auto

# Wait up to 10s for link and 60s for DHCP (avoids timeouts on Proxmox bridges).
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 60

# Temporary hostname & domain (Proxmox Cloud-Init will change this on cloned VMs).
d-i netcfg/get_hostname string debian-template
d-i netcfg/get_domain string duane

# Skip searching for proprietary hardware firmware (Proxmox VMs don't need it).
d-i hw-detect/load_firmware boolean false

# Optional: Static IP (uncomment if your Proxmox bridge has no DHCP server)
#d-i netcfg/disable_autoconfig boolean true
#d-i netcfg/get_ipaddress string 192.168.1.50
#d-i netcfg/get_netmask string 255.255.255.0
#d-i netcfg/get_gateway string 192.168.1.1
#d-i netcfg/get_nameservers string 1.1.1.1
#d-i netcfg/confirm_static boolean true

### 3. Debian Package Mirror
# Downloads packages from deb.debian.org (routes automatically to the fastest mirror).
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### 4. User Accounts & Passwords
# Must match `ssh_username` and `ssh_password` in your Packer .pkr.hcl file.
# Disabling direct root login makes Debian install `sudo` automatically.
d-i passwd/root-login boolean false

d-i passwd/user-fullname string Packer Admin
d-i passwd/username string packer
d-i passwd/user-password password packer
d-i passwd/user-password-again password packer

d-i user-setup/allow-password-weak boolean true

# Optional: Use a hashed password (`mkpasswd -m sha-512`) instead of plaintext above
#d-i passwd/user-password-crypted password $6$REPLACE_WITH_HASH

### 5. Clock & Timezone
# Hardware clock stays in UTC (standard for Linux servers and VMs).
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### 6. Disk Partitioning (Wipes the VM's virtual disk automatically)
# Picks the first virtual disk (/dev/sda for SCSI, /dev/vda for VirtIO).
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"

# 'regular' = standard partitions (recommended so Cloud-Init can auto-resize disks).
# Switch to 'lvm' only if you specifically want LVM volumes.
d-i partman-auto/method string regular
d-i partman-auto-lvm/guided_size string max

# 'atomic' = puts everything in one simple root partition + swap.
d-i partman-auto/choose_recipe select atomic

# Auto-confirm all disk wipe / overwrite prompts.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Optional: Force GPT partition table (only uncomment if UEFI/OVMF builds fail)
#d-i partman-partitioning/choose_label select gpt
#d-i partman-partitioning/default_label string gpt

### 7. APT Setup (Software Repositories)
# Don't prompt for extra CDs/DVDs and remove the install ISO from apt sources after install.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Enable security patches and regular updates.
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# Optional: Enable non-free / contrib repositories if needed later
#d-i apt-setup/non-free-firmware boolean true
#d-i apt-setup/non-free boolean true
#d-i apt-setup/contrib boolean true

### 8. Software & Packages
# Install only minimal CLI tools and SSH (no desktop GUI).
tasksel tasksel/first multiselect standard, ssh-server

# Proxmox & Packer essentials:
# - openssh-server   : lets Packer and you SSH into the VM
# - sudo             : lets the packer user run admin commands
# - qemu-guest-agent : lets Proxmox detect the VM IP and shut down cleanly
# - cloud-init       : lets Proxmox set hostname, IP, and SSH keys on clones
# - curl             : basic download utility
d-i pkgsel/include string openssh-server sudo qemu-guest-agent cloud-init curl

# Upgrade packages at the end of install and skip the usage survey prompt.
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### 9. Bootloader (GRUB)
# Automatically install GRUB to the primary virtual disk.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### 10. Finish & Reboot
# Skip the final "Installation complete" confirmation screen.
d-i finish-install/reboot_in_progress note

### 11. Post-Install Commands (Runs right before first reboot)
# `/target` = the new Debian filesystem; `in-target` runs commands inside it.
# 1) Allow `packer` to run sudo without a password prompt (required by Packer).
# 2) Enable qemu-guest-agent on boot so Proxmox sees the VM's IP immediately.
d-i preseed/late_command string \
    echo 'packer ALL=(ALL) NOPASSWD: ALL' > /target/etc/sudoers.d/packer; \
    chmod 440 /target/etc/sudoers.d/packer; \
    in-target systemctl enable qemu-guest-agent
